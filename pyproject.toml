[project]
name = "flowforge"
version = "0.1.0"
description = "Distributed Python workflow automation engine (FastAPI + Redis + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "redis>=5.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "apscheduler>=3.10,<4",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = ["slow: slower failure-injection tests"]

[tool.setuptools.packages.find]
include = ["app*"]
